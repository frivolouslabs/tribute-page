<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Tribute Page</title>
  <script src="config.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
    }

    .tk-page * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== HERO SECTION ===== */

    .tk-hero {
      position: relative;
      width: 100%;
      min-height: 85vh;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      background: #111;
    }

    .tk-hero-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }

    .tk-hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.7) 0%,
        rgba(0, 0, 0, 0.45) 40%,
        rgba(0, 0, 0, 0.1) 70%,
        rgba(0, 0, 0, 0) 100%
      );
    }

    .tk-hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 64px;
      max-width: 560px;
    }

    .tk-hero-title {
      font-family: 'Lora', serif;
      font-size: 52px;
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    .tk-hero-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .tk-hero-detail {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .tk-hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #111;
      background: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      align-self: flex-start;
      letter-spacing: 0.3px;
    }

    .tk-hero-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .tk-hero-btn:active {
      transform: translateY(0);
    }

    .tk-hero-btn .arrow {
      font-size: 20px;
      transition: transform 0.2s;
    }

    .tk-hero-btn:hover .arrow {
      transform: translateY(2px);
    }

    @media (max-width: 768px) {
      .tk-hero {
        min-height: 90vh;
        align-items: flex-end;
      }

      .tk-hero-overlay {
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8) 0%,
          rgba(0, 0, 0, 0.5) 40%,
          rgba(0, 0, 0, 0.1) 70%,
          rgba(0, 0, 0, 0) 100%
        );
      }

      .tk-hero-content {
        padding: 40px 24px 48px;
        max-width: 100%;
      }

      .tk-hero-title {
        font-size: 36px;
        margin-bottom: 20px;
      }

      .tk-hero-subtitle {
        font-size: 16px;
      }

      .tk-hero-detail {
        font-size: 14px;
        margin-bottom: 32px;
      }

      .tk-hero-btn {
        padding: 14px 32px;
        font-size: 15px;
      }
    }

    /* ===== FORM SECTION ===== */

    .tribute-form-wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 60px;
      font-family: 'Inter', sans-serif;
      color: #2c3e50;
    }

    .tribute-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .tribute-header h2 {
      font-family: 'Lora', serif;
      font-size: 30px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 10px 0;
    }

    .tribute-header p {
      font-size: 16px;
      color: #6b7b8d;
      margin: 4px 0;
      line-height: 1.6;
    }

    .tribute-field {
      margin-bottom: 24px;
    }

    .tribute-field label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .tribute-field label .required {
      color: #e74c3c;
      margin-left: 2px;
    }

    .tribute-field label .optional {
      font-weight: 400;
      color: #8e99a4;
      font-size: 13px;
      margin-left: 4px;
    }

    .tribute-field input[type="text"],
    .tribute-field input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      border: 1.5px solid #d1d9e0;
      border-radius: 10px;
      background: #fff;
      color: #1a1a1a;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .tribute-field input:focus {
      outline: none;
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }

    .tribute-field input::placeholder {
      color: #b0b8c1;
    }

    .tribute-row {
      display: flex;
      gap: 16px;
    }

    .tribute-row .tribute-field {
      flex: 1;
    }

    .section-label {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
      display: block;
    }

    .section-label .optional {
      font-weight: 400;
      color: #8e99a4;
      font-size: 13px;
      margin-left: 4px;
    }

    .section-hint {
      font-size: 13px;
      color: #8e99a4;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    #tribute-editor-container {
      border: 1.5px solid #d1d9e0;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      margin-bottom: 28px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #tribute-editor-container:focus-within {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }

    #tribute-editor-container .ql-toolbar {
      border: none;
      border-bottom: 1px solid #e8ecf0;
      background: #f8f9fb;
      padding: 8px 12px;
    }

    #tribute-editor-container .ql-container {
      border: none;
      font-family: 'Lora', serif;
      font-size: 16px;
      color: #1a1a1a;
    }

    #tribute-editor-container .ql-editor {
      min-height: 360px;
      padding: 20px 24px;
      line-height: 1.8;
    }

    #tribute-editor-container .ql-editor.ql-blank::before {
      color: #b0b8c1;
      font-style: italic;
      font-size: 15px;
    }

    .upload-zone {
      border: 2px dashed #d1d9e0;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 28px;
      position: relative;
    }

    .upload-zone:hover {
      border-color: #a0aec0;
      background: #f8f9fb;
    }

    .upload-zone.drag-over {
      border-color: #1a1a1a;
      background: #f0f2f5;
    }

    .upload-zone.has-files {
      border-style: solid;
      border-color: #c8d6e5;
      background: #f8f9fb;
    }

    .upload-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 32px;
      color: #c8d6e5;
      margin-bottom: 8px;
      line-height: 1;
    }

    .upload-zone-text {
      font-size: 15px;
      color: #6b7b8d;
      margin: 0;
    }

    .upload-zone-text strong {
      color: #1a1a1a;
    }

    .upload-zone-subtext {
      font-size: 12px;
      color: #a0aec0;
      margin: 6px 0 0 0;
    }

    .file-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
    }

    .file-preview-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e0e5ea;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #2c3e50;
      max-width: 220px;
    }

    .file-preview-item .file-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .file-preview-item .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .photo-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .file-remove {
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 18px;
      padding: 0 0 0 4px;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0.6;
      transition: opacity 0.15s;
    }

    .file-remove:hover {
      opacity: 1;
    }

    .upload-size-error {
      color: #b91c1c;
      font-size: 13px;
      margin-top: 8px;
    }

    .tribute-submit-btn {
      display: block;
      width: 100%;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: #1a1a1a;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .tribute-submit-btn:hover {
      background: #333;
    }

    .tribute-submit-btn:active {
      transform: scale(0.99);
    }

    .tribute-submit-btn:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    .tribute-success {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }

    .tribute-success .checkmark {
      width: 64px;
      height: 64px;
      background: #1a1a1a;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .tribute-success h3 {
      font-family: 'Lora', serif;
      font-size: 26px;
      color: #1a1a1a;
      margin: 0 0 10px 0;
    }

    .tribute-success p {
      font-size: 15px;
      color: #6b7b8d;
      margin: 0;
      line-height: 1.5;
    }

    .tribute-error {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .tribute-row {
        flex-direction: column;
        gap: 0;
      }
      .tribute-form-wrapper {
        padding: 60px 16px 40px;
      }
      .tribute-header h2 {
        font-size: 24px;
      }
      #tribute-editor-container .ql-editor {
        min-height: 300px;
        padding: 16px;
      }
      .upload-zone {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

<div class="tk-page">

  <div class="tk-hero">
    <img class="tk-hero-image" id="cfg-hero-photo" src="" alt="" />
    <div class="tk-hero-overlay"></div>

    <div class="tk-hero-content">
      <h1 class="tk-hero-title" id="cfg-hero-title"></h1>
      <p class="tk-hero-subtitle" id="cfg-hero-subtitle"></p>
      <p class="tk-hero-detail" id="cfg-hero-detail"></p>
      <a href="#tribute-form-section" class="tk-hero-btn" id="cfg-hero-btn" onclick="event.preventDefault(); document.getElementById('tribute-form-section').scrollIntoView({ behavior: 'smooth', block: 'start' });">
        <span id="cfg-hero-btn-text"></span> <span class="arrow">&darr;</span>
      </a>
    </div>
  </div>

  <div class="tribute-form-wrapper" id="tribute-form-section">

    <div class="tribute-header">
      <h2 id="cfg-form-heading"></h2>
      <p id="cfg-form-desc1"></p>
      <p id="cfg-form-desc2"></p>
    </div>

    <form id="tribute-form" enctype="multipart/form-data">

      <div class="tribute-row">
        <div class="tribute-field">
          <label for="tribute-first">First Name <span class="required">*</span></label>
          <input type="text" id="tribute-first" name="first_name" placeholder="First name" required />
        </div>
        <div class="tribute-field">
          <label for="tribute-last">Last Name <span class="required">*</span></label>
          <input type="text" id="tribute-last" name="last_name" placeholder="Last name" required />
        </div>
      </div>

      <div class="tribute-field">
        <label for="tribute-email">Email <span class="required">*</span></label>
        <input type="email" id="tribute-email" name="email" placeholder="your@email.com" required />
      </div>

      <label class="section-label"><span id="cfg-story-prompt"></span> <span class="optional">(Optional)</span></label>
      <p class="section-hint">Use the toolbar to format your text &mdash; bold, italics, headings, colors, and more.</p>

      <div id="tribute-editor-container">
        <div id="tribute-editor"></div>
      </div>

      <input type="hidden" id="tribute-message-html" name="message" />

      <label class="section-label"><span id="cfg-photo-label"></span> <span class="optional">(Optional)</span></label>
      <p class="section-hint" id="cfg-photo-hint"></p>

      <div class="upload-zone" id="photo-upload-zone">
        <input type="file" id="photo-input" name="photos" accept="image/*" multiple />
        <div class="upload-icon">&#128247;</div>
        <p class="upload-zone-text"><strong>Click to upload</strong> or drag photos here</p>
        <p class="upload-zone-subtext">JPG, PNG, HEIC &mdash; max 10 photos per submission</p>
        <div class="file-preview-list" id="photo-preview-list"></div>
      </div>

      <div class="tribute-error" id="tribute-error"></div>

      <button type="submit" class="tribute-submit-btn" id="tribute-submit">
        SEND
      </button>
    </form>

    <div class="tribute-success" id="tribute-success">
      <div class="checkmark">&#10003;</div>
      <h3 id="cfg-success-title"></h3>
      <p id="cfg-success-message"></p>
    </div>
  </div>

</div>

<script>
(function() {
  // Populate page from config.js
  document.title = CONFIG.pageTitle || 'Birthday Tribute Page';
  document.getElementById('cfg-hero-photo').src = CONFIG.heroPhoto;
  document.getElementById('cfg-hero-photo').alt = CONFIG.heroPhotoAlt;
  document.getElementById('cfg-hero-title').innerHTML = CONFIG.heroTitle;
  document.getElementById('cfg-hero-subtitle').textContent = CONFIG.heroSubtitle;
  document.getElementById('cfg-hero-detail').textContent = CONFIG.heroDetail;
  document.getElementById('cfg-hero-btn-text').textContent = CONFIG.heroButton;
  document.getElementById('cfg-form-heading').textContent = CONFIG.formHeading;
  document.getElementById('cfg-form-desc1').textContent = CONFIG.formDescription1;
  var desc2 = document.getElementById('cfg-form-desc2');
  if (CONFIG.formDescription2) {
    desc2.textContent = CONFIG.formDescription2;
  } else {
    desc2.style.display = 'none';
  }
  document.getElementById('cfg-story-prompt').textContent = CONFIG.storyPrompt;
  document.getElementById('cfg-photo-label').textContent = CONFIG.photoLabel;
  document.getElementById('cfg-photo-hint').textContent = CONFIG.photoHint;
  document.getElementById('cfg-success-title').textContent = CONFIG.successTitle;
  document.getElementById('cfg-success-message').innerHTML = CONFIG.successMessage;

  var FORM_ENDPOINT = CONFIG.formEndpoint;

  var quill = new Quill('#tribute-editor', {
    theme: 'snow',
    placeholder: CONFIG.editorPlaceholder || 'I remember when\u2026',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        [{ 'font': [] }],
        [{ 'size': ['small', false, 'large', 'huge'] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'align': [] }],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        ['blockquote'],
        ['clean']
      ]
    }
  });

  var MAX_FILE_SIZE = 100 * 1024 * 1024;
  var storedFiles = {};

  function setupUploadZone(zoneId, inputId, previewId) {
    var zone = document.getElementById(zoneId);
    var input = document.getElementById(inputId);
    var previewList = document.getElementById(previewId);
    storedFiles[inputId] = [];

    zone.addEventListener('dragover', function(e) {
      e.preventDefault();
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', function() {
      zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop', function(e) {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) {
        addFiles(inputId, e.dataTransfer.files, previewList);
      }
    });
    input.addEventListener('change', function() {
      addFiles(inputId, input.files, previewList);
      input.value = '';
    });
  }

  function addFiles(inputId, fileList, previewList) {
    var isMultiple = document.getElementById(inputId).hasAttribute('multiple');
    var tooLarge = [];
    var MAX_PHOTOS = 10;

    for (var i = 0; i < fileList.length; i++) {
      if (fileList[i].size > MAX_FILE_SIZE) {
        tooLarge.push(fileList[i].name);
        continue;
      }
      if (isMultiple) {
        if (storedFiles[inputId].length >= MAX_PHOTOS) {
          showUploadError(previewList, 'Max ' + MAX_PHOTOS + ' photos per submission. Come back and submit again for more!');
          break;
        }
        storedFiles[inputId].push(fileList[i]);
      } else {
        storedFiles[inputId] = [fileList[i]];
      }
    }

    renderPreviews(inputId, previewList);

    if (tooLarge.length) {
      var msg = tooLarge.join(', ') + (tooLarge.length === 1 ? ' is' : ' are') + ' too large and ' + (tooLarge.length === 1 ? 'was' : 'were') + ' not added.';
      showUploadError(previewList, msg);
    }
  }

  function showUploadError(previewList, msg) {
    var errEl = previewList.parentElement.querySelector('.upload-size-error');
    if (!errEl) {
      errEl = document.createElement('p');
      errEl.className = 'upload-size-error';
      previewList.parentElement.appendChild(errEl);
    }
    errEl.textContent = msg;
    setTimeout(function() { if (errEl.parentElement) errEl.remove(); }, 5000);
  }

  function removeFile(inputId, index, previewList) {
    storedFiles[inputId].splice(index, 1);
    renderPreviews(inputId, previewList);
  }

  function renderPreviews(inputId, previewList) {
    previewList.innerHTML = '';
    var zone = previewList.closest('.upload-zone');
    var files = storedFiles[inputId];

    if (!files.length) { zone.classList.remove('has-files'); return; }
    zone.classList.add('has-files');

    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      var item = document.createElement('div');
      item.className = 'file-preview-item';

      if (file.type.startsWith('image/')) {
        var thumb = document.createElement('img');
        thumb.className = 'photo-thumb';
        thumb.src = URL.createObjectURL(file);
        item.appendChild(thumb);
      } else {
        var icon = document.createElement('span');
        icon.className = 'file-icon';
        icon.textContent = '\uD83C\uDFA5';
        item.appendChild(icon);
      }

      var name = document.createElement('span');
      name.className = 'file-name';
      name.textContent = file.name;
      item.appendChild(name);

      var sizeSpan = document.createElement('span');
      sizeSpan.style.cssText = 'color:#8e99a4;font-size:12px;flex-shrink:0;';
      sizeSpan.textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
      item.appendChild(sizeSpan);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'file-remove';
      removeBtn.innerHTML = '&times;';
      removeBtn.addEventListener('click', (function(idx, iid, pl) {
        return function(e) {
          e.stopPropagation();
          e.preventDefault();
          removeFile(iid, idx, pl);
        };
      })(i, inputId, previewList));
      item.appendChild(removeBtn);

      previewList.appendChild(item);
    }
  }

  setupUploadZone('photo-upload-zone', 'photo-input', 'photo-preview-list');

  var form = document.getElementById('tribute-form');
  var submitBtn = document.getElementById('tribute-submit');
  var successDiv = document.getElementById('tribute-success');
  var errorDiv = document.getElementById('tribute-error');
  var hiddenInput = document.getElementById('tribute-message-html');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    hiddenInput.value = quill.root.innerHTML;

    errorDiv.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    var formData = new FormData(form);

    formData.delete('photos');
    var photoFiles = storedFiles['photo-input'] || [];
    for (var p = 0; p < photoFiles.length; p++) {
      formData.append('photos', photoFiles[p], photoFiles[p].name);
    }

    fetch(FORM_ENDPOINT, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    })
    .then(function(response) {
      if (response.ok) {
        form.style.display = 'none';
        successDiv.style.display = 'block';
        window.scrollTo({ top: successDiv.offsetTop - 100, behavior: 'smooth' });
      } else {
        return response.json().then(function(data) { throw new Error(data.error || 'Submission failed'); });
      }
    })
    .catch(function(err) {
      errorDiv.textContent = 'Something went wrong. Please try again. (' + err.message + ')';
      errorDiv.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'SEND';
    });
  });
})();
</script>

</body>
</html>
